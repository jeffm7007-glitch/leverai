[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/dialer/:splat"
  status = 200

[[redirects]]
  from = "/franchises/"
  to = "/franchises/index.html"
  status = 200

[[redirects]]
  from = "/monitoring/"
  to = "/monitoring/index.html"
  status = 200

[[redirects]]
  from = "/ai-audit/"
  to = "/ai-audit/index.html"
  status = 200

[[redirects]]
  from = "/embed-calculator/"
  to = "/embed-calculator/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
