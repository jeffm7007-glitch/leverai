 // --- ANIMATED COUNT ELEMENT ---
 const AnimatedCount = ({ value, prefix = "", suffix = "", duration = 1000 }) => {
 const [count, setCount] = useState(0);
 useEffect(() => {
 let start = 0;
 const end = parseFloat(value.toString().replace(/[^0-9.]/g, ''));
 if (start === end) return;

 let totalMiliseconds = duration;
 let incrementTime = Math.max(Math.floor(totalMiliseconds / end), 20);

 let timer = setInterval(() => {
 start += Math.ceil(end / (totalMiliseconds / incrementTime));
 if (start >= end) {
 clearInterval(timer);
 start = end;
 }
 setCount(start);
 }, incrementTime);

 return () => clearInterval(timer);
 }, [value]);

 const formatDisplay = (num) => {
 if (num >= 1000) return num.toLocaleString();
 return num;
 };

 return <span>{prefix}{formatDisplay(value)}{suffix}</span>;
 };
